<script>
  document.addEventListener("DOMContentLoaded", () => {
    const strip = document.getElementById("heroScroll");
    const parallaxWrapper = document.querySelector(".hero-parallax");
    let position = 0;
    const speed = 0.4; // horizontal scroll speed
    let blurTimeout = null;

    function scrollImages() {
      position -= speed;
      strip.style.transform = `translateX(${position}px)`;

      // subtle global fade effect as we move through pairs
      const fadeFactor = 0.85 + 0.15 * Math.sin(position / 120);
      strip.style.opacity = fadeFactor;

      // Reset loop when half the strip has moved
      if (Math.abs(position) > strip.scrollWidth / 2) {
        position = 0;
      }
      requestAnimationFrame(scrollImages);
    }

    scrollImages();

    // Parallax effect on vertical scroll + motion blur during scroll
    window.addEventListener("scroll", () => {
      const scrollY = window.scrollY || window.pageYOffset;

      // vertical parallax — hero moves slightly slower than page
      if (parallaxWrapper) {
        parallaxWrapper.style.transform = `translateY(${scrollY * 0.08}px)`;
      }

      // add blur while scrolling, then remove after short delay
      if (!strip) return;
      strip.classList.add("hero-blur");
      if (blurTimeout) clearTimeout(blurTimeout);
      blurTimeout = setTimeout(() => {
        strip.classList.remove("hero-blur");
      }, 180);
    });
  });
</script>
